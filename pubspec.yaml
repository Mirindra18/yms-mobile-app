name: yms_mobile_app
description: "Application mobile YMS : formations, inscriptions et scan de QR codes."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Réseau & état
  dio: ^5.11.0
  http: ^1.6.0
  provider: ^6.1.5+1
  flutter_secure_storage: ^11.0.0

  # Formatage de dates et nombres
  intl: ^0.19.0

  # Typographie : téléchargement à l'exécution désactivé pour éviter une
  # dépendance réseau au démarrage (polices système sans assets embarqués).
  google_fonts: ^6.2.1

  # Icônes
  cupertino_icons: ^1.0.8

  # Fonctionnalités supplémentaires
  url_launcher: ^6.3.1
  stomp_dart_client: ^2.0.0
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2
  shared_preferences: ^2.5.6
  qr_flutter: ^4.1.0
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/