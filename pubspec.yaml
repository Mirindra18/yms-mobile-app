name: yms_mobile_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Paquets HTTP & État
  dio: ^5.11.0
  provider: ^6.1.5+1
  flutter_secure_storage: ^11.0.0

  # Formatage de dates et nombres (résout l'erreur intl)
  intl: ^0.19.0

  # Typographie premium (polices Google, avec fallback hors-ligne)
  google_fonts: ^6.2.1

  # Icônes
  cupertino_icons: ^1.0.8

  # Fonctionnalités supplémentaires
  url_launcher: ^6.3.1
  stomp_dart_client: ^2.0.0
  mobile_scanner: ^5.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/